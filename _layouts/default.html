<!DOCTYPE html>
<html lang="{{ site.lang | default: 'ja' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  {% seo %}
  {% feed_meta %}
  {%- if site.google_analytics and jekyll.environment == "production" %}
  <script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', '{{ site.google_analytics }}');
  </script>
  {%- endif %}
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="site-title" href="{{ '/wiki/' | relative_url }}">{{ site.title }}</a>
      <nav class="site-nav">
        <a href="{{ '/wiki/all/' | relative_url }}">記事一覧</a>
        <a href="{{ '/wiki/years/' | relative_url }}">年別</a>
        <a href="{{ '/wiki/tags/' | relative_url }}">タグ</a>
        <a href="{{ '/wiki/about/' | relative_url }}">このサイトについて</a>
      </nav>
    </div>
  </header>
  <main class="wrap">
    {{ content }}
  </main>
  <footer class="site-footer">
    <div class="wrap">
      <a href="https://twitter.com/kinug">@kinug</a> の作業記録です。内容は書いた時点のものです。
    </div>
  </footer>
</body>
</html>
